<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Thank You | Quixprint</title>
  <link rel="icon" type="image/png" href="/QXP Favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 28px;
      color: #000;
      background: #e1dfd9;
      font-family: "DM Sans", sans-serif;
    }
    main {
      width: min(100%, 850px);
      padding: clamp(36px, 7vw, 78px);
      background: #fff;
      border: 1px solid rgba(0,0,0,.14);
    }
    .kicker {
      margin: 0 0 20px;
      color: #147ee0;
      font-size: .76rem;
      font-weight: 800;
      letter-spacing: .15em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-family: "Manrope", sans-serif;
      font-size: clamp(3rem, 8vw, 6rem);
      line-height: .98;
      letter-spacing: -.06em;
    }
    .copy {
      max-width: 650px;
      margin: 28px 0 34px;
      color: #666;
      font-size: 1.08rem;
      line-height: 1.65;
    }
    a {
      display: inline-flex;
      min-height: 50px;
      align-items: center;
      padding: 0 24px;
      color: #fff;
      background: #147ee0;
      font-weight: 700;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <p class="kicker">Careers at Quixprint</p>
    <h1>Thanks for introducing yourself.</h1>
    <p class="copy">
      We've received your information. Although we may not have an immediate opening,
      we appreciate your interest and will keep your background in mind as future needs arise.
    </p>
    <a href="/careers/">Back to careers</a>
  </main>
</body>
</html>
