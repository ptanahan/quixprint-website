<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 390" role="img" aria-labelledby="t d"><title id="t">How saddle-stitched and perfect-bound books open</title><desc id="d">Saddle stitch opens flatter around a center fold with staples; perfect binding curves near the glued spine, so important content should stay out of the gutter.</desc><rect width="920" height="390" rx="18" fill="#f6f5f1"/><g font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#24303a"><text x="236" y="49" font-size="25" font-weight="700">Saddle stitch</text><text x="690" y="49" font-size="25" font-weight="700">Perfect binding</text></g><path d="M67 126 Q157 105 236 132 Q316 105 405 126 L405 278 Q318 258 236 287 Q157 258 67 278Z" fill="#fff" stroke="#80919a" stroke-width="3"/><path d="M236 132V287" stroke="#7b8588" stroke-width="3"/><g fill="#7b8588"><rect x="230" y="177" width="12" height="5" rx="2"/><rect x="230" y="231" width="12" height="5" rx="2"/></g><path d="M521 131 Q604 108 679 145 Q755 108 841 131 L841 282 Q760 255 679 295 Q603 255 521 282Z" fill="#fff" stroke="#80919a" stroke-width="3"/><path d="M659 142 Q679 185 679 295 Q699 185 719 142" fill="#e8d6c6"/><path d="M679 145V295" stroke="#846f60" stroke-width="5"/><g font-family="Arial,Helvetica,sans-serif" font-size="18" text-anchor="middle"><text x="236" y="332" fill="#426b59" font-weight="700">Opens flatter</text><text x="690" y="332" fill="#ad6742" font-weight="700">Allow extra gutter margin</text><text x="460" y="370" font-size="15" fill="#59636b">Simplified illustrations; actual opening depends on paper and construction.</text></g></svg>