<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 330" role="img" aria-labelledby="t d"><title id="t">Binding eligibility by page count</title><desc id="d">Saddle stitch typically suits shorter booklets; perfect binding starts at 48 pages for Quixprint. Saddle stitch maximum depends on stock and format.</desc><rect width="920" height="330" rx="18" fill="#f6f5f1"/><g font-family="Arial,Helvetica,sans-serif" fill="#24303a"><text x="45" y="53" font-size="27" font-weight="700">Page count: where each binding fits</text><text x="45" y="84" font-size="17" fill="#59636b">Quixprint perfect binding starts at 48 pages; saddle stitch varies by stock and size.</text><text x="45" y="145" font-size="20" font-weight="700">Saddle stitch</text><text x="45" y="216" font-size="20" font-weight="700">Perfect binding</text></g><rect x="245" y="119" width="620" height="31" rx="8" fill="#e2e4e3"/><rect x="245" y="190" width="620" height="31" rx="8" fill="#e2e4e3"/><rect x="245" y="119" width="365" height="31" rx="8" fill="#9bb3a4"/><rect x="438" y="190" width="427" height="31" rx="8" fill="#263b46"/><path d="M438 107V237" stroke="#b76b42" stroke-width="2" stroke-dasharray="5 5"/><text x="438" y="258" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#b76b42">48 pages</text><text x="245" y="283" font-family="Arial" font-size="16" fill="#59636b">Shorter booklets</text><text x="865" y="283" text-anchor="end" font-family="Arial" font-size="16" fill="#59636b">Thicker publications</text><text x="45" y="311" font-family="Arial" font-size="14" fill="#59636b">Illustrative only — confirm saddle-stitch limits for your chosen size and paper.</text></svg>