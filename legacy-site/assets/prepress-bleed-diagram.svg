<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 610"><rect width="1000" height="610" fill="#f8f5f0"/><text x="55" y="60" font-family="Arial" font-weight="bold" font-size="29" fill="#1b2928">Bleed, trim &amp; safe zone</text><rect x="230" y="110" width="480" height="410" fill="#d6e7e4" stroke="#d47a60" stroke-width="4" stroke-dasharray="12 8"/><rect x="262" y="142" width="416" height="346" fill="#f4d5b9" stroke="#243c38" stroke-width="4"/><rect x="306" y="186" width="328" height="258" fill="#fff9ee" stroke="#258b78" stroke-width="4" stroke-dasharray="9 7"/><text x="470" y="285" text-anchor="middle" font-family="Arial" font-size="24" fill="#243c38" font-weight="bold">YOUR DESIGN</text><text x="470" y="320" text-anchor="middle" font-family="Arial" font-size="18" fill="#243c38">Keep text &amp; logos here</text><text x="50" y="150" font-family="Arial" font-size="20" fill="#b05b42">BLEED</text><text x="50" y="177" font-family="Arial" font-size="16" fill="#243c38">0.125″ outside trim</text><path d="M175 165 L230 165" stroke="#b05b42" stroke-width="3"/><text x="735" y="220" font-family="Arial" font-size="20" fill="#243c38">TRIM</text><text x="735" y="247" font-family="Arial" font-size="16" fill="#243c38">Finished cut edge</text><path d="M735 228 L678 228" stroke="#243c38" stroke-width="3"/><text x="735" y="375" font-family="Arial" font-size="20" fill="#258b78">SAFE ZONE</text><text x="735" y="402" font-family="Arial" font-size="16" fill="#243c38">0.125″–0.25″ inside</text><path d="M735 382 L634 382" stroke="#258b78" stroke-width="3"/><text x="500" y="566" text-anchor="middle" font-family="Arial" font-size="16" fill="#52615e">Extend edge-to-edge backgrounds to the outer bleed line</text></svg>